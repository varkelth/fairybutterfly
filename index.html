<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acces prive</title>
<style>
  :root {
    --bg: #14161a;
    --card: #1e222a;
    --card2: #262b35;
    --text: #e8ecf1;
    --muted: #8b95a5;
    --accent: #4da3ff;
    --green: #3ecf8e;
    --red: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1c2430 0%, var(--bg) 60%);
    color: var(--text);
  }
  .card {
    width: min(92vw, 400px);
    background: var(--card);
    border: 1px solid #2b313c;
    border-radius: 16px;
    padding: 28px 26px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
  }
  h1 { font-size: 21px; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  input {
    width: 100%;
    background: var(--card2);
    color: var(--text);
    border: 1px solid #2b313c;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    outline: none;
    margin-bottom: 12px;
  }
  input:focus { border-color: var(--accent); }
  button, .btn {
    display: block;
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  button:hover, .btn:hover { filter: brightness(1.1); }
  .err { color: var(--red); font-size: 13px; min-height: 18px; margin: 10px 0 0; }
  .hidden { display: none; }
  .status {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--card2);
    color: var(--muted);
    display: inline-block;
    margin-bottom: 18px;
  }
  .status.on { color: var(--green); }
  .status.off { color: var(--red); }
</style>
</head>
<body>
<div class="card" id="loginCard">
  <h1>Acces prive</h1>
  <p class="sub">Entre le mot de passe pour acceder au serveur.</p>
  <input id="pw" type="password" placeholder="Mot de passe" autocomplete="off">
  <button id="go">Entrer</button>
  <p id="err" class="err"></p>
</div>

<div class="card hidden" id="panel">
  <h1>Serveur Minecraft</h1>
  <span id="status" class="status">verification...</span>
  <a id="mapBtn" class="btn" href="#" target="_blank" rel="noopener">Ouvrir la carte 3D en direct</a>
  <p class="sub" style="margin: 16px 0 0;">Carte 3D live : joueurs, traces, morts et derniers lieux de connexion.</p>
</div>

<script>
/* ====== A MODIFIER ====== */
const PASSWORD = 'fairybutterfly';          // <-- change ton mot de passe ici
const MAP_URL = 'https://fairybutterfly.duckdns.org';
/* ======================= */

const loginCard = document.getElementById('loginCard');
const panel = document.getElementById('panel');
const err = document.getElementById('err');

function unlock() {
  loginCard.classList.add('hidden');
  panel.classList.remove('hidden');
  sessionStorage.setItem('unlocked', '1');
  checkStatus();
}

document.getElementById('go').addEventListener('click', () => {
  const value = document.getElementById('pw').value;
  if (value === PASSWORD) unlock();
  else err.textContent = 'Mot de passe incorrect.';
});

document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('go').click();
});

document.getElementById('mapBtn').href = MAP_URL;

async function checkStatus() {
  const status = document.getElementById('status');
  try {
    const r = await fetch('/api/players', { cache: 'no-store' });
    const j = await r.json();
    if (j.ok && j.data && (Date.now() - (j.data.updated || 0)) < 180000) {
      const count = Object.keys(j.data.players || {}).length;
      status.textContent = 'Serveur en ligne';
      status.className = 'status on';
    } else {
      status.textContent = 'Serveur hors ligne';
      status.className = 'status off';
    }
  } catch (e) {
    status.textContent = 'Serveur hors ligne';
    status.className = 'status off';
  }
}

if (sessionStorage.getItem('unlocked') === '1') unlock();
</script>
</body>
</html>
